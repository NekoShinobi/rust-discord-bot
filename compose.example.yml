
services:
  rin:
    build: .
    volumes:
      - ./storage.db:/app/storage.db
      - ./config.toml:/app/config.toml
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - AUTHOR_ID=
      - DISCORD_TOKEN=
      - SONARR_API_KEY=
      - SONARR_URL=https://sonarr.example
      - FOOTER_URL=your.url
      - OPENWEATHERMAP_API_KEY=
      - KICK_CLIENT_ID=
      - KICK_CLIENT_SECRET=
      # Currently only ollama.
      - LOCALAI_URL=https://ollama.example
      - SHOKO_SERVER_API_KEY=
      - SHOKO_SERVER_URL=https://shoko-server.example
      - SERVE_STATIC_URL=https://static.example
      - TMDB_API_KEY=
      - QDRANT_URL=http://qdrant:6334
      - EMBEDDING_MODEL=nomic-embed-text
      - QUERY_EXPAND_MODEL=gemma4:e2b
      # - OUTLINE_URL=https://outline.example
      # - OUTLINE_API_KEY=
      # - OUTLINE_COLLECTION_ID=
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./qdrant_storage:/qdrant/storage
    ports:
      - 6333:6333
      - 6334:6334
