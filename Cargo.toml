[package]
name = "rust-discord-bot"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
log = { version = "0.4.29", features = ["std"] }
miette = "7.6.0"
poise = "0.6.1"
redb = "4.0.0"
regex = "1.12.3"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
rust_cast = "0.21.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
reqwest-websocket = "0.6.0"
tokio-graceful-shutdown = "0.19.2"
toml = "1.0.4"
uuid = { version = "1.21.0", features = ["v4"] }
yt-dlp = "2.4.0"
url = "2.5.8"
actix-web = "4.13.0"
urlencoding = "2.1.3"
actix-files = "0.6.10"
simplelog = "0.12.2"
rustls = { version = "0.23.37", features = ["aws-lc-rs"] }

[dependencies.symphonia]
version = "0.5.5"
features = ["aac", "mp3", "isomp4", "alac", "mkv", "ogg"]

[dependencies.songbird]
git = "https://github.com/serenity-rs/songbird"
branch = "next"
features = ["builtin-queue"]

[dependencies.serenity]
version = "0.12.5"
features = ["builder", "client", "utils", "collector", "standard_framework", "voice", "rustls_backend", "cache"]

[dependencies.tokio]
version = "1.50.0"
features = ["macros", "rt-multi-thread", "signal"]
